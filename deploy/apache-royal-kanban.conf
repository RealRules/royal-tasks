# Royal Kanban - Apache virtual host.
#
#   sudo cp deploy/apache-royal-kanban.conf /etc/apache2/sites-available/royal-kanban.conf
#   sudo a2enmod headers proxy_fcgi setenvif ssl rewrite
#   sudo a2ensite royal-kanban
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# The app is one directory: it is the DocumentRoot, and src/, config.php and
# uploads/ live inside it. src/ and config.php are PHP (executed, not sent);
# uploads/ is denied here and by the .htaccess install.php writes there.
#
#   /srv/royal-kanban/
#   |-- app/          <- git checkout; DocumentRoot
#   `-- var/
#       |-- uploads/  <- optional: move attachments out of the docroot by
#       |                pointing 'upload_dir' at this in config.php
#       `-- sessions/ <- PHP session files, outside the docroot and the app

<VirtualHost *:80>
    ServerName kanban.example.com

    # Certbot writes its challenge here; everything else goes to HTTPS.
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
        RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
    </IfModule>
</VirtualHost>

<VirtualHost *:443>
    ServerName kanban.example.com

    DocumentRoot /srv/royal-kanban/app

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/kanban.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/kanban.example.com/privkey.pem

    <Directory /srv/royal-kanban/app>
        Require all granted
        # No directory listings; FollowSymLinks so a release symlink works.
        Options -Indexes +FollowSymLinks
        # install.php writes .htaccess here (config, src/, uploads/ and the
        # dev folders). Allow it to take effect.
        AllowOverride All
        DirectoryIndex index.html index.php
    </Directory>

    # Belt and braces for when AllowOverride is disabled. install.php writes
    # the same rules; these keep the paths unreadable even without it.
    <LocationMatch "^/(src|styles|scripts|deploy|node_modules)/">
        Require all denied
    </LocationMatch>
    <Location "^/config.php">
        Require all denied
    </Location>
    <LocationMatch "^/uploads/">
        Require all denied
    </LocationMatch>

    # Dotfiles are never content.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # PHP through php-fpm. Adjust the socket to your PHP version.
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
    </FilesMatch>

    <IfModule mod_headers.c>
        Header always set X-Frame-Options "DENY"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "same-origin"
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

        # api/index.php and api/file.php send their own, much stricter policies.
        # setifempty adds one only when PHP has not already - a plain "set"
        # would overwrite the API's CSP with this weaker line.
        Header setifempty Content-Security-Policy "frame-ancestors 'none'"

        # Never let a proxy or browser cache an API response.
        <LocationMatch "^/api/">
            Header always set Cache-Control "no-store"
        </LocationMatch>
    </IfModule>

    # The app allows 12 MB per file and 10 files per request; leave headroom
    # for the multipart envelope. Must not be lower than PHP's post_max_size.
    LimitRequestBody 136314880

    # No rewrite rules: the app uses real file paths and api/index.php, so
    # there is no front controller to route unknown URLs to.

    ErrorLog  ${APACHE_LOG_DIR}/royal-kanban-error.log
    CustomLog ${APACHE_LOG_DIR}/royal-kanban-access.log combined
</VirtualHost>
