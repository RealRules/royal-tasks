; Royal Kanban — php-fpm pool.
;
;   sudo cp deploy/php-fpm-royal-kanban.conf /etc/php/8.4/fpm/pool.d/royal-kanban.conf
;   sudo systemctl restart php8.4-fpm
;
; Running the app in its own pool keeps these limits — and open_basedir in
; particular — from applying to every other site on the machine.

[royal-kanban]
user = www-data
group = www-data

listen = /run/php/php8.4-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Uploads: 12 MB per file, up to 10 files per request (Uploads::MAX_BYTES and
; MAX_FILES_PER_REQUEST). post_max_size must exceed the largest batch.
php_admin_value[upload_max_filesize] = 12M
php_admin_value[post_max_size] = 130M
php_admin_value[max_file_uploads] = 10

; PHP must never print an error into a response; the app logs its own.
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on

; Confine the process to the code, the var directory and the upload scratch
; space. Boards and users are in the database, so there is no data directory;
; attachments live in the app folder by default (or in var/uploads if you move
; them). Add every path the app is configured to use.
php_admin_value[open_basedir] = /srv/royal-kanban/app:/srv/royal-kanban/var:/tmp:/usr/share/php

; Sessions do NOT live in the app folder — PHP writes them wherever
; session.save_path points, which is shared between sites by default. Give the
; app its own directory so another vhost cannot read its session files.
php_admin_value[session.save_path] = /srv/royal-kanban/var/sessions
php_value[session.gc_maxlifetime] = 43200

; The app sets these per-request as well; these are the floor.
php_value[session.cookie_httponly] = 1
php_value[session.cookie_samesite] = Lax
php_value[session.cookie_secure] = 1
